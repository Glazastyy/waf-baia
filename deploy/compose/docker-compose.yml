services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: baia
      POSTGRES_USER: baia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baia -d baia"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../apps/core/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - baia

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - baia

  core:
    build:
      context: ../..
      dockerfile: apps/core/Dockerfile
    env_file:
      - ../../config/secrets.env
    environment:
      BAIA_CONFIG_PATH: /config/platform.yaml
      DATABASE_URL: postgres://baia:${POSTGRES_PASSWORD}@postgres:5432/baia
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../config/platform.yaml:/config/platform.yaml:ro
    networks:
      - baia

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - core
    networks:
      - baia

  caddy:
    build:
      context: ../../services/caddy
      dockerfile: Dockerfile
    env_file:
      - ../../config/secrets.env
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    depends_on:
      - web
      - core
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    networks:
      - baia

  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.1
    environment:
      COLLECTIONS: crowdsecurity/caddy
    volumes:
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - caddy-logs:/var/log/caddy:ro
      - ../../services/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
    networks:
      - baia

  powerdns-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: powerdns
      POSTGRES_USER: powerdns
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - powerdns-db-data:/var/lib/postgresql/data
    networks:
      - baia

  powerdns:
    image: powerdns/pdns-auth-master:latest
    environment:
      PDNS_AUTH_API: "yes"
      PDNS_AUTH_API_KEY: ${BAIA_POWERDNS_API_KEY}
      PDNS_AUTH_WEBSERVER: "yes"
      PDNS_AUTH_WEBSERVER_ADDRESS: 0.0.0.0
      PDNS_AUTH_WEBSERVER_ALLOW_FROM: 0.0.0.0/0
      PDNS_AUTH_LAUNCH: gpgsql
      PDNS_AUTH_GPGSQL_HOST: powerdns-db
      PDNS_AUTH_GPGSQL_USER: powerdns
      PDNS_AUTH_GPGSQL_PASSWORD: ${POSTGRES_PASSWORD}
      PDNS_AUTH_GPGSQL_DBNAME: powerdns
    depends_on:
      - powerdns-db
    networks:
      - baia

  poweradmin:
    image: poweradmin/poweradmin:latest
    environment:
      DB_HOST: powerdns-db
      DB_USER: powerdns
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: powerdns
    depends_on:
      - powerdns
    networks:
      - baia

networks:
  baia:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  caddy-logs:
  crowdsec-data:
  crowdsec-config:
  powerdns-db-data:
