services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: baia
      POSTGRES_USER: baia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baia -d baia"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../apps/core/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - baia

  postgres-init:
    image: postgres:18.1-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: ["sh", "-c", "psql -h postgres -U baia -d baia -v ON_ERROR_STOP=1 -f /init/00-create-powerdns.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres-init/00-create-powerdns.sql:/init/00-create-powerdns.sql:ro
    networks:
      - baia

  redis:
    image: redis:8.4.5-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - baia

  core:
    build:
      context: ../..
      dockerfile: apps/core/Dockerfile
    env_file:
      - ../../config/secrets.env
    environment:
      BAIA_CONFIG_PATH: /config/platform.yaml
      DATABASE_URL: postgres://baia:${POSTGRES_PASSWORD}@postgres:5432/baia
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../config/platform.yaml:/config/platform.yaml:ro
    networks:
      - baia

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - core
    networks:
      - baia

  caddy:
    build:
      context: ../../services/caddy
      dockerfile: Dockerfile
    env_file:
      - ../../config/secrets.env
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - core
    volumes:
      - ../../config/generated/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    networks:
      - baia

  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    environment:
      COLLECTIONS: crowdsecurity/caddy
    volumes:
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - caddy-logs:/var/log/caddy:ro
      - ../../services/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
    networks:
      - baia

  powerdns:
    image: powerdns/pdns-auth-51:5.1.3
    environment:
      PDNS_AUTH_API: "yes"
      PDNS_AUTH_API_KEY: ${BAIA_POWERDNS_API_KEY}
      PDNS_AUTH_WEBSERVER: "yes"
      PDNS_AUTH_WEBSERVER_ADDRESS: 0.0.0.0
      PDNS_AUTH_WEBSERVER_ALLOW_FROM: 0.0.0.0/0
      PDNS_AUTH_LAUNCH: gpgsql
      PDNS_AUTH_GPGSQL_HOST: postgres
      PDNS_AUTH_GPGSQL_USER: baia
      PDNS_AUTH_GPGSQL_PASSWORD: ${POSTGRES_PASSWORD}
      PDNS_AUTH_GPGSQL_DBNAME: powerdns
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - baia

  poweradmin:
    image: poweradmin/poweradmin:stable
    environment:
      DB_HOST: postgres
      DB_USER: baia
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: powerdns
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      powerdns:
        condition: service_started
    networks:
      - baia

networks:
  baia:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  caddy-logs:
  crowdsec-data:
  crowdsec-config:
